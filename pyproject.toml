[project]
name = "tp5-sav"
version = "1.0.0"
description = "TP5 Agentic AI — Service après-vente"
requires-python = ">=3.12,<3.14"
dependencies = [
    "langchain>=1.2,<2",
    "langchain-ollama>=1,<2",
    "langchain-community>=0.4,<1",
    "langchain-experimental>=0.4,<1",
    "langchain-tavily>=0.2,<1",
    "langchain-mcp-adapters>=0.2,<1",
    "langgraph>=1,<2",
    "langgraph-cli[inmem]>=0.4,<1",
    "mcp>=1.25,<2",
    "streamlit>=1.50,<2",
    "chromadb>=1.4,<2",
    "PyMuPDF>=1.26,<2",
    "numpy>=2,<3",
    "pillow>=11,<14",
    "pydantic>=2,<3",
    "python-dotenv>=1,<2",
    "tzdata>=2025",
    "ddgs>=9,<10",
    "ipykernel>=6,<8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tp5"]
